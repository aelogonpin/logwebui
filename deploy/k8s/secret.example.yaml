# Copy this file to secret.yaml, fill in real values, and apply it —
# secret.yaml is not meant to be committed (add it to your own .gitignore
# if you keep it in this directory).
#
#   cp secret.example.yaml secret.yaml
#   # edit secret.yaml with real values
#   kubectl apply -f secret.yaml -n <namespace>
apiVersion: v1
kind: Secret
metadata:
  name: lokiviews-env
  labels:
    app.kubernetes.io/name: lokiviews
type: Opaque
stringData:
  LOKI_URL: "https://loki.example.com"
  LOKI_USER: "changeme"
  LOKI_PASS: "changeme"
  # Optional — see README.md "Configuración" for what each variable does.
  LOKI_ORG_ID: ""
  MIMIR_URL: ""
  MIMIR_USER: ""
  MIMIR_PASS: ""
  MIMIR_ORG_ID: ""
